name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, test and migrate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: solvex
          POSTGRES_USER: solvex
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U solvex -d solvex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql+psycopg://solvex:postgres@localhost:5432/solvex
      SECRET_KEY: ci-only-secret-key-not-for-production
      ENABLE_SCHEDULER: "false"

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check app tests alembic
          ruff format --check app tests alembic

      - name: Test
        run: pytest -q

      - name: Apply migrations
        run: |
          alembic upgrade head
          alembic check
          alembic current

  docker:
    name: Build API image
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Build
        run: docker build -t solvex-api:ci .
