services:
  db:
    image: postgres:17-alpine
    container_name: solvex-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: solvex
      POSTGRES_USER: solvex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - solvex_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solvex -d solvex"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: .
    container_name: solvex-api
    restart: unless-stopped
    profiles: ["api"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: ${APP_NAME:-SolveX API}
      DEBUG: ${DEBUG:-false}
      DATABASE_URL: postgresql+psycopg://solvex:${POSTGRES_PASSWORD}@db:5432/solvex
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:3000","http://localhost:5173"]}'
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-30}
      ENABLE_SCHEDULER: ${ENABLE_SCHEDULER:-true}
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 5

  adminer:
    image: adminer:5
    container_name: solvex-adminer
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "8080:8080"

volumes:
  solvex_pgdata:
