services:
  db:
    image: postgres:17-alpine
    container_name: solvex-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: solvex
      POSTGRES_USER: solvex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - solvex_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solvex -d solvex"]
      interval: 5s
      timeout: 5s
      retries: 12

  adminer:
    image: adminer:5
    container_name: solvex-adminer
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "8080:8080"

volumes:
  solvex_pgdata:
